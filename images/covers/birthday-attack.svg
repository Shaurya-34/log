<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" fill="none">
  <g stroke="#17150f" opacity=".16">
    <path d="M90 500H910"/>
    <path d="M500 80V600"/>
    <path d="M170 560L830 130"/>
  </g>

  <g fill="#17150f">
    <circle cx="150" cy="180" r="2.5"/>
    <circle cx="205" cy="240" r="2"/>
    <circle cx="260" cy="150" r="2.5"/>
    <circle cx="310" cy="290" r="2"/>
    <circle cx="360" cy="200" r="2.5"/>
    <circle cx="415" cy="340" r="2"/>
    <circle cx="470" cy="160" r="2.5"/>
    <circle cx="520" cy="380" r="2"/>
    <circle cx="230" cy="410" r="2.5"/>
    <circle cx="290" cy="470" r="2"/>
    <circle cx="340" cy="420" r="2.5"/>
    <circle cx="605" cy="250" r="2"/>
    <circle cx="655" cy="320" r="2.5"/>
    <circle cx="700" cy="220" r="2"/>
    <circle cx="750" cy="380" r="2.5"/>
    <circle cx="800" cy="290" r="2"/>
    <circle cx="845" cy="430" r="2.5"/>
    <circle cx="600" cy="470" r="2"/>
    <circle cx="660" cy="500" r="2.5"/>
    <circle cx="180" cy="330" r="2"/>
    <circle cx="440" cy="470" r="2.5"/>
    <circle cx="500" cy="520" r="2"/>
    <circle cx="720" cy="150" r="2"/>
    <circle cx="770" cy="490" r="2.5"/>
  </g>

  <!-- The draw order that leads to the match - the whole point being
       that it takes far fewer draws than the field of dots suggests. -->
  <path
    d="M150 180 L360 200 L470 160 L605 250 L700 220 L575 305 L720 150 L575 305"
    class="draw-path"
    stroke="#17150f"
    stroke-width="1.2"
    stroke-dasharray="2200" stroke-dashoffset="2200"/>

  <!-- The two draws that land in the same place. Kept a few pixels
       apart rather than exactly coincident - two dots on top of each
       other reads as one dot, not as a collision. -->
  <circle cx="571" cy="301" r="3" fill="#17150f"/>
  <circle cx="579" cy="309" r="3" fill="#17150f"/>
  <circle cx="575" cy="305" r="20" stroke="#17150f" stroke-width="1"/>

  <g fill="#17150f" font-family="monospace" font-size="16" letter-spacing=".05em">
    <text x="605" y="300">← SAME BUCKET</text>
    <text x="90" y="600">√N DRAWS, NOT N</text>
  </g>
</svg>
