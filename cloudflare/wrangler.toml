name = "sslog-markdown"
main = "markdown-worker.js"
compatibility_date = "2026-08-23"
workers_dev = false

# GitHub Pages remains the origin; the Worker adds content negotiation
# in front of the existing custom domain.
[vars]
ORIGIN = "https://shaurya-34.github.io/log"

[[routes]]
pattern = "sslog.dpdns.org/*"
zone_name = "dpdns.org"
